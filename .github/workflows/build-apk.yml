name: Build Wear OS APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: watchface-${{ github.ref }}
  cancel-in-progress: true
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android build tools
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build APK
        run: gradle --no-daemon :app:assembleRelease
      - name: Verify resource-only APK and package metadata
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release-unsigned.apk dist/rail-dial-1.1.0-unsigned.apk
          python3 -c 'from zipfile import ZipFile; z=ZipFile("dist/rail-dial-1.1.0-unsigned.apk"); assert not any(p.endswith(".dex") for p in z.namelist()), "WFF must contain resources only"'
          "$ANDROID_HOME/build-tools/35.0.0/aapt2" dump badging dist/rail-dial-1.1.0-unsigned.apk > dist/package-info.txt
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" dist/apksigner.jar
          sha256sum dist/rail-dial-1.1.0-unsigned.apk > dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: rail-dial-1.1.0-unsigned-build
          path: dist/
          if-no-files-found: error
